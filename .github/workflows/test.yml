name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: python -m compileall -q core tests
      - name: Test without launching Firefox
        run: python -m pytest -q
      - name: Reject tracked runtime driver logs
        run: |
          if git ls-files | grep -E '(^|/)(geckodriver|chromedriver)(\..*)?\.log$'; then
            echo 'Runtime WebDriver logs must not be tracked.' >&2
            exit 1
          fi
